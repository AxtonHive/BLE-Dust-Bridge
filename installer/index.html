<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLE Dust Bridge · Web Installer</title>
  <script>
    window.__bldbSerialPort = null;
    (function () {
      if (typeof SerialPort !== 'undefined' && SerialPort.prototype && SerialPort.prototype.open) {
        const origOpen = SerialPort.prototype.open;
        SerialPort.prototype.open = async function (options) {
          window.__bldbSerialPort = this;
          const res = await origOpen.apply(this, arguments);
          try {
            await this.setSignals({ dataTerminalReady: true, requestToSend: false });
          } catch (_) {}
          return res;
        };
      }
    })();
  </script>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #283b31;
      color: #1f2e26;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #f7f3e3;
      border: 1px solid #dfd9c5;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.4rem;
      color: #283b31;
    }
    p {
      margin: 0 0 22px 0;
      font-size: 0.92rem;
      color: #5c6b63;
      line-height: 1.5;
    }
    esp-web-install-button {
      --esp-tools-button-color: #283b31;
      --esp-tools-button-text-color: #f7f3e3;
      --esp-tools-button-border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>BLE Dust Bridge</h1>
    <p>Connect your M5Stack AtomS3 Lite via USB-C using Chrome, Brave or Edge to install firmware.</p>
    <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
  </div>
  <script>
    function buildQrSvg(text) {
      const size = 25;
      const bytes = Array.from(new TextEncoder().encode(text));
      const bits = [];
      const pushBits = (val, len) => {
        for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1);
      };
      pushBits(0b0100, 4);
      pushBits(bytes.length, 8);
      bytes.forEach((b) => pushBits(b, 8));
      pushBits(0, 4);
      while (bits.length % 8 !== 0) bits.push(0);
      const dataCw = [];
      for (let i = 0; i < bits.length; i += 8) {
        let v = 0;
        for (let b = 0; b < 8; b++) v = (v << 1) | bits[i + b];
        dataCw.push(v);
      }
      const pads = [0xec, 0x11];
      let pi = 0;
      while (dataCw.length < 34) {
        dataCw.push(pads[pi++ % 2]);
      }

      const exp = new Uint8Array(512);
      const log = new Uint8Array(256);
      let x = 1;
      for (let i = 0; i < 255; i++) {
        exp[i] = x;
        log[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
      }
      for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
      const gfMul = (a, b) => (a === 0 || b === 0 ? 0 : exp[log[a] + log[b]]);
      let gen = [1];
      for (let i = 0; i < 10; i++) {
        const next = new Array(gen.length + 1).fill(0);
        for (let j = 0; j < gen.length; j++) {
          next[j] ^= gen[j];
          next[j + 1] ^= gfMul(gen[j], exp[i]);
        }
        gen = next;
      }
      const rem = new Array(10).fill(0);
      for (const cw of dataCw) {
        const factor = cw ^ rem.shift();
        rem.push(0);
        for (let i = 0; i < 10; i++) rem[i] ^= gfMul(gen[i + 1], factor);
      }
      const allCw = dataCw.concat(rem);
      const stream = [];
      for (const cw of allCw) pushBits(cw, 8);
      while (stream.length < 359) stream.push(0);

      const mod = Array.from({ length: size }, () => new Int8Array(size).fill(-1));
      const isFunc = Array.from({ length: size }, () => new Uint8Array(size));
      const setFunc = (r, c, v) => {
        if (r >= 0 && r < size && c >= 0 && c < size) {
          mod[r][c] = v ? 1 : 0;
          isFunc[r][c] = 1;
        }
      };
      const drawFinder = (r0, c0) => {
        for (let dr = -1; dr <= 7; dr++) {
          for (let dc = -1; dc <= 7; dc++) {
            const inOuter = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6;
            const inInner = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
            const onBorder = dr === 0 || dr === 6 || dc === 0 || dc === 6;
            setFunc(r0 + dr, c0 + dc, inOuter && (onBorder || inInner) ? 1 : 0);
          }
        }
      };
      drawFinder(0, 0);
      drawFinder(0, size - 7);
      drawFinder(size - 7, 0);

      for (let dr = -2; dr <= 2; dr++) {
        for (let dc = -2; dc <= 2; dc++) {
          const dark = Math.max(Math.abs(dr), Math.abs(dc)) !== 1;
          setFunc(18 + dr, 18 + dc, dark ? 1 : 0);
        }
      }
      for (let i = 8; i < size - 8; i++) {
        setFunc(6, i, i % 2 === 0 ? 1 : 0);
        setFunc(i, 6, i % 2 === 0 ? 1 : 0);
      }
      setFunc(size - 8, 8, 1);
      for (let i = 0; i < 9; i++) {
        if (!isFunc[8][i]) setFunc(8, i, 0);
        if (!isFunc[i][8]) setFunc(i, 8, 0);
      }
      for (let i = 0; i < 8; i++) {
        if (!isFunc[8][size - 1 - i]) setFunc(8, size - 1 - i, 0);
        if (!isFunc[size - 1 - i][8]) setFunc(size - 1 - i, 8, 0);
      }

      let bitIdx = 0;
      let upward = true;
      for (let col = size - 1; col >= 1; col -= 2) {
        if (col === 6) col--;
        for (let step = 0; step < size; step++) {
          const row = upward ? size - 1 - step : step;
          for (let dx = 0; dx < 2; dx++) {
            const c = col - dx;
            if (!isFunc[row][c]) {
              const bit = bitIdx < stream.length ? stream[bitIdx++] : 0;
              mod[row][c] = bit;
            }
          }
        }
        upward = !upward;
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!isFunc[r][c] && (r + c) % 2 === 0) mod[r][c] ^= 1;
        }
      }
      const fmt = 0x77c4;
      for (let i = 0; i < 6; i++) setFunc(8, i, (fmt >>> (14 - i)) & 1);
      setFunc(8, 7, (fmt >>> 8) & 1);
      setFunc(8, 8, (fmt >>> 7) & 1);
      setFunc(7, 8, (fmt >>> 6) & 1);
      for (let i = 0; i < 6; i++) setFunc(5 - i, 8, (fmt >>> i) & 1);
      for (let i = 0; i < 8; i++) setFunc(8, size - 1 - i, (fmt >>> i) & 1);
      for (let i = 0; i < 7; i++) setFunc(size - 7 + i, 8, (fmt >>> (14 - i)) & 1);

      let rects = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (mod[r][c] === 1) rects += `<rect x="${c + 2}" y="${r + 2}" width="1" height="1"/>`;
        }
      }
      const vb = size + 4;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vb} ${vb}" width="132" height="132" shape-rendering="crispEdges" style="background:#ffffff;border:1px solid #dfd9c5;border-radius:10px;padding:4px;"><g fill="#1f2e26">${rects}</g></svg>`;
    }

    async function sendSerialAuthLine(line) {
      const port = window.__bldbSerialPort;
      if (!port || !port.writable) return false;
      for (let attempt = 0; attempt < 10 && port.writable.locked; attempt++) {
        await new Promise((r) => setTimeout(r, 50));
      }
      if (port.writable.locked) return false;
      const writer = port.writable.getWriter();
      try {
        await writer.write(new TextEncoder().encode(line + '\n'));
        return true;
      } catch (_) {
        return false;
      } finally {
        writer.releaseLock();
      }
    }

    (function () {
      window.__bldbFlashed = false;
      const observedRoots = new WeakSet();
      const MENU_SELECTOR = 'md-list-item, mwc-list-item, ewt-list-item, li, button, a, [role="menuitem"], [role="button"]';

      function findAllElements(root, out = []) {
        if (!root) return out;
        const els = root.querySelectorAll ? root.querySelectorAll('*') : [];
        els.forEach((el) => {
          out.push(el);
          if (el.shadowRoot) findAllElements(el.shadowRoot, out);
        });
        return out;
      }

      function getElLabel(el) {
        if (!el) return '';
        const attrLbl = (typeof el.label === 'string' && el.label) || el.getAttribute('label') || '';
        const txt = (el.textContent || '').trim();
        return (attrLbl || txt).trim();
      }

      function setElementLabel(el, newText) {
        if (!el) return;
        if (typeof el.label === 'string') el.label = newText;
        if (el.hasAttribute && el.hasAttribute('label')) el.setAttribute('label', newText);
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
        let node;
        let replaced = false;
        while ((node = walker.nextNode())) {
          if ((node.nodeValue || '').trim().length > 0) {
            if (!replaced) {
              node.nodeValue = newText;
              replaced = true;
            } else {
              node.nodeValue = '';
            }
          }
        }
        if (!replaced && el.shadowRoot) {
          setElementLabel(el.shadowRoot, newText);
        }
      }

      function sanitizeNodeTree(root, hostDialog) {
        if (!root) return;

        const fullText = (root.textContent || '');
        if (fullText.indexOf('Connected to BLE-Dust-Bridge') !== -1 || fullText.indexOf('Installation complete') !== -1) {
          window.__bldbFlashed = true;
        }

        const allEls = findAllElements(root);
        let installItem = null;
        let wifiItem = null;

        allEls.forEach((el) => {
          if (el.shadowRoot && !observedRoots.has(el.shadowRoot)) {
            attachShadowObserver(el.shadowRoot, hostDialog || el);
          }

          const rawTxt = getElLabel(el);

          if (el.children.length === 0 && (rawTxt === '🎉' || rawTxt.indexOf('\uD83C\uDF89') !== -1)) {
            el.style.display = 'none';
          }

          const isMenu = el.matches && el.matches(MENU_SELECTOR);
          if (isMenu && (rawTxt.indexOf('Logs & Console') !== -1 || rawTxt.indexOf('Add to Home Assistant') !== -1)) {
            el.style.display = 'none';
          }

          if (isMenu && rawTxt.indexOf('Erase User Data') !== -1) {
            setElementLabel(el, 'Erase and Install Firmware');
          }

          if (isMenu && rawTxt.indexOf('Install BLE Dust Bridge') !== -1) {
            installItem = el;
          }

          if (isMenu && rawTxt.indexOf('Connect to Wi-Fi') !== -1 && el.id !== 'bldb-disabled-wifi-item') {
            wifiItem = el;
          }
        });

        const isUnflashedMenu = !!installItem && !window.__bldbFlashed && fullText.indexOf('Connected to BLE-Dust-Bridge') === -1;
        if (isUnflashedMenu) {
          if (wifiItem) {
            wifiItem.style.opacity = '0.42';
            wifiItem.style.pointerEvents = 'none';
            wifiItem.setAttribute('aria-disabled', 'true');
            if ('disabled' in wifiItem) wifiItem.disabled = true;
          } else if (installItem.parentNode && !installItem.parentNode.querySelector('#bldb-disabled-wifi-item')) {
            const disabledWifi = installItem.cloneNode(true);
            disabledWifi.id = 'bldb-disabled-wifi-item';
            const oldIcon = disabledWifi.querySelector('[slot="start"], svg');
            const wifiSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            wifiSvg.setAttribute('slot', 'start');
            wifiSvg.setAttribute('width', '24');
            wifiSvg.setAttribute('height', '24');
            wifiSvg.setAttribute('viewBox', '0 0 24 24');
            wifiSvg.setAttribute('fill', 'currentColor');
            wifiSvg.innerHTML = '<path d="M12 18c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm-4.9-2.3l1.4 1.4C9.4 16.4 10.6 16 12 16s2.6.4 3.5 1.1l1.4-1.4C15.6 14.6 13.9 14 12 14s-3.6.6-4.9 1.7zm-2.8-2.8l1.4 1.4C7.3 13 9.5 12 12 12s4.7 1 6.3 2.3l1.4-1.4C17.7 11.1 15 10 12 10s-5.7 1.1-7.7 2.9zM1.5 10.1l1.4 1.4C5.3 9.3 8.5 8 12 8s6.7 1.3 9.1 3.5l1.4-1.4C19.7 7.5 16 6 12 6S4.3 7.5 1.5 10.1z"/>';
            if (oldIcon && oldIcon.parentNode) {
              oldIcon.parentNode.replaceChild(wifiSvg, oldIcon);
            } else {
              disabledWifi.insertBefore(wifiSvg, disabledWifi.firstChild);
            }
            setElementLabel(disabledWifi, 'Connect to Wi-Fi');
            disabledWifi.disabled = true;
            disabledWifi.setAttribute('disabled', '');
            disabledWifi.setAttribute('aria-disabled', 'true');
            disabledWifi.style.opacity = '0.42';
            disabledWifi.style.pointerEvents = 'none';
            disabledWifi.style.cursor = 'not-allowed';
            installItem.parentNode.insertBefore(disabledWifi, installItem);
          }
        } else {
          const staleDisabled = root.querySelector ? root.querySelector('#bldb-disabled-wifi-item') : null;
          if (staleDisabled) staleDisabled.remove();
          if (wifiItem) {
            wifiItem.style.opacity = '';
            wifiItem.style.pointerEvents = '';
            wifiItem.removeAttribute('aria-disabled');
            if ('disabled' in wifiItem) wifiItem.disabled = false;
          }
        }

        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        let node;
        while ((node = walker.nextNode())) {
          const v = node.nodeValue || '';
          if (v.indexOf('This will take 2 minutes') !== -1) {
            node.nodeValue = 'Installing';
          } else if (v.indexOf('Keep this page visible for fastest installation') !== -1) {
            node.nodeValue = '';
          } else if (v.indexOf('Erase User Data') !== -1) {
            node.nodeValue = v.replace('Erase User Data', 'Erase and Install Firmware');
          }
        }

        if (fullText.indexOf('Erase device') !== -1) {
          const cb = allEls.find(
            (e) =>
              (e.tagName === 'INPUT' && e.type === 'checkbox') ||
              e.tagName === 'MWC-CHECKBOX' ||
              e.tagName === 'HA-CHECKBOX' ||
              e.getAttribute('role') === 'checkbox'
          );
          const installBtn = allEls.find((e) => {
            if (!e.matches || !e.matches('mwc-button, ewt-button, button')) return false;
            const t = getElLabel(e);
            return t === 'Install' || t === 'Erase & Install';
          });
          if (cb && installBtn) {
            const syncInstallBtn = () => {
              const isChecked = !!cb.checked || cb.getAttribute('aria-checked') === 'true';
              const targetLabel = isChecked ? 'Erase & Install' : 'Install';
              if (getElLabel(installBtn) !== targetLabel) {
                setElementLabel(installBtn, targetLabel);
              }
            };
            syncInstallBtn();
            if (!cb.__bldbBound) {
              cb.__bldbBound = true;
              cb.addEventListener('change', () => setTimeout(syncInstallBtn, 0));
              cb.addEventListener('click', () => setTimeout(syncInstallBtn, 0));
            }
          }
        }

        if (fullText.indexOf('erase all user data') !== -1) {
          const actionBtns = allEls.filter((e) => e.matches && e.matches('mwc-button, ewt-button, button'));
          const hasCancel = actionBtns.some((b) => getElLabel(b).toLowerCase() === 'cancel');
          const primaryBtn = actionBtns.find((b) => {
            const t = getElLabel(b).toLowerCase();
            return t === 'erase' || t === 'continue' || t === 'yes' || t === 'erase user data';
          });
          if (!hasCancel && primaryBtn && primaryBtn.parentNode) {
            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.slot = 'secondaryAction';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.style.cssText =
              'margin-right:8px;padding:8px 14px;border-radius:6px;border:1px solid #dfd9c5;background:#eef0eb;color:#1f2e26;font-weight:600;font-size:0.86rem;cursor:pointer;';
            cancelBtn.onclick = (ev) => {
              ev.preventDefault();
              ev.stopPropagation();
              const dlg = allEls.find((e) => e.matches && e.matches('mwc-dialog, ha-dialog, dialog'));
              if (dlg && typeof dlg.close === 'function') dlg.close();
              else if (hostDialog && hostDialog.remove) hostDialog.remove();
            };
            primaryBtn.parentNode.insertBefore(cancelBtn, primaryBtn);
          }
        }

        if (fullText.indexOf('Device connected to the network') !== -1) {
          const visitLink = allEls.find((e) => {
            const t = getElLabel(e);
            return (e.tagName === 'A' || (e.matches && e.matches('mwc-list-item, ewt-list-item, button'))) &&
                   (t.indexOf('Visit Device') !== -1 || t.indexOf('Go to Settings') !== -1);
          });
          let ipUrl = '';
          if (visitLink) {
            if (getElLabel(visitLink).indexOf('Visit Device') !== -1) {
              setElementLabel(visitLink, 'Go to Settings');
            }
            const href = visitLink.getAttribute('href') || visitLink.href || '';
            if (href && href.startsWith('http')) {
              ipUrl = href.replace(/\/+$/, '');
            } else {
              const innerA = visitLink.shadowRoot && visitLink.shadowRoot.querySelector('a');
              if (innerA && innerA.href) ipUrl = innerA.href.replace(/\/+$/, '');
            }
          }

          const hostContainer = (visitLink && visitLink.parentElement) || root.querySelector('div') || root;
          if (hostContainer && !hostContainer.querySelector('#bldb-post-wifi-panel')) {
            const panel = document.createElement('div');
            panel.id = 'bldb-post-wifi-panel';
            panel.style.cssText =
              'margin:12px 0 6px 0;padding:14px;background:#fbf9f1;border:1px solid #dfd9c5;border-radius:12px;text-align:left;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1f2e26;';

            const mdnsUrl = 'http://bldb.local';
            const ipDisplay = ipUrl || 'http://192.168.4.1';

            panel.innerHTML = `
              <div style="font-weight:700;font-size:0.9rem;color:#283b31;margin-bottom:8px;">Web UI Login</div>
              <div id="bldb-auth-inputs" style="display:flex;flex-direction:column;gap:7px;margin-bottom:8px;">
                <input id="bldb-inst-user" type="text" value="admin" placeholder="Username" style="width:100%;padding:7px 9px;border:1px solid #dfd9c5;border-radius:6px;font-size:0.85rem;background:#ffffff;color:#1f2e26;" />
                <input id="bldb-inst-pass" type="password" placeholder="Password" style="width:100%;padding:7px 9px;border:1px solid #dfd9c5;border-radius:6px;font-size:0.85rem;background:#ffffff;color:#1f2e26;" />
              </div>
              <label style="display:flex;align-items:center;gap:7px;font-size:0.82rem;color:#5c6b63;cursor:pointer;margin-bottom:9px;">
                <input id="bldb-inst-none" type="checkbox" style="width:15px;height:15px;accent-color:#283b31;" />
                <span>None (no login required)</span>
              </label>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                <button id="bldb-inst-save-auth" type="button" style="background:#283b31;color:#f7f3e3;border:none;border-radius:6px;padding:7px 12px;font-size:0.82rem;font-weight:600;cursor:pointer;">Save Login</button>
                <span id="bldb-inst-auth-status" style="font-size:0.78rem;font-weight:600;color:#283b31;"></span>
              </div>
              <div style="border-top:1px solid #dfd9c5;padding-top:12px;text-align:center;">
                <div style="margin-bottom:8px;">${buildQrSvg(mdnsUrl)}</div>
                <div style="font-size:0.84rem;font-weight:700;margin-bottom:3px;">
                  <a href="${mdnsUrl}" target="_blank" rel="noopener" style="color:#283b31;text-decoration:underline;">${mdnsUrl}</a>
                </div>
                <div id="bldb-ip-url-row" style="font-size:0.82rem;font-family:monospace;color:#5c6b63;">
                  <a id="bldb-ip-url-link" href="${ipDisplay}" target="_blank" rel="noopener" style="color:#283b31;text-decoration:underline;">${ipDisplay}</a>
                </div>
              </div>
            `;

            if (visitLink && visitLink.parentNode) {
              visitLink.parentNode.insertBefore(panel, visitLink);
            } else {
              hostContainer.appendChild(panel);
            }

            const noneCb = panel.querySelector('#bldb-inst-none');
            const authInputs = panel.querySelector('#bldb-auth-inputs');
            const userInp = panel.querySelector('#bldb-inst-user');
            const passInp = panel.querySelector('#bldb-inst-pass');
            const saveBtn = panel.querySelector('#bldb-inst-save-auth');
            const statusSpan = panel.querySelector('#bldb-inst-auth-status');

            noneCb.addEventListener('change', () => {
              const disabled = noneCb.checked;
              userInp.disabled = disabled;
              passInp.disabled = disabled;
              authInputs.style.opacity = disabled ? '0.45' : '1';
            });

            saveBtn.addEventListener('click', async () => {
              if (noneCb.checked) {
                const ok = await sendSerialAuthLine('BLDB_SET_AUTH {"en":0}');
                statusSpan.style.color = ok ? '#283b31' : '#b83232';
                statusSpan.textContent = ok ? 'Login disabled!' : 'USB port unavailable';
                return;
              }
              const u = userInp.value.trim();
              const p = passInp.value;
              if (!u || !p) {
                statusSpan.style.color = '#b83232';
                statusSpan.textContent = 'Enter username & password';
                return;
              }
              const payload = JSON.stringify({ en: 1, user: u, pass: p });
              const ok = await sendSerialAuthLine('BLDB_SET_AUTH ' + payload);
              statusSpan.style.color = ok ? '#283b31' : '#b83232';
              statusSpan.textContent = ok ? 'Login saved!' : 'USB port unavailable';
            });
          } else if (ipUrl) {
            const ipLink = hostContainer.querySelector('#bldb-ip-url-link');
            if (ipLink && ipLink.textContent !== ipUrl) {
              ipLink.href = ipUrl;
              ipLink.textContent = ipUrl;
            }
          }
        }
      }

      function attachShadowObserver(shadowRoot, hostDialog) {
        if (!shadowRoot || observedRoots.has(shadowRoot)) return;
        observedRoots.add(shadowRoot);
        sanitizeNodeTree(shadowRoot, hostDialog);
        const mo = new MutationObserver(() => sanitizeNodeTree(shadowRoot, hostDialog));
        mo.observe(shadowRoot, { childList: true, subtree: true, characterData: true });
      }

      const bodyObserver = new MutationObserver((mutations) => {
        for (const m of mutations) {
          for (const node of m.addedNodes) {
            if (node && node.nodeType === 1) {
              if (node.shadowRoot) attachShadowObserver(node.shadowRoot, node);
              sanitizeNodeTree(node, node);
            }
          }
        }
      });
      bodyObserver.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>

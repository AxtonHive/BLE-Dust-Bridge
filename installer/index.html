<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLE Dust Bridge · Web Installer</title>
  <script>
    window.__bldbSerialPort = null;
    (function () {
      if (typeof SerialPort !== 'undefined' && SerialPort.prototype && SerialPort.prototype.open) {
        const origOpen = SerialPort.prototype.open;
        SerialPort.prototype.open = async function (options) {
          window.__bldbSerialPort = this;
          const res = await origOpen.apply(this, arguments);
          try {
            await this.setSignals({ dataTerminalReady: true, requestToSend: false });
          } catch (_) {}
          return res;
        };
      }
    })();
  </script>
</body>
</html>
